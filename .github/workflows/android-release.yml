name: Android Signed Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athir-android-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate web app and Capacitor sync
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check source
        run: npm run lint

      - name: Build web bundle
        run: npm run build

      - name: Verify Capacitor Android synchronization
        run: npx cap sync android

  android-release:
    name: Build, sign, verify, and publish APK
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: android-release
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install pinned Android SDK platform and build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Select next stable version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tagName // ""')"
          current_package_version="$(node -p "require('./package.json').version")"
          if [[ -z "$latest_tag" ]]; then
            if [[ ! "$current_package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Current package version is not stable SemVer: $current_package_version" >&2
              exit 1
            fi
            version="$current_package_version"
          else
            if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest stable release tag is not supported SemVer: $latest_tag" >&2
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version="$major.$minor.$((patch + 1))"
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Release tag v$version already exists; refusing to overwrite it." >&2
            exit 1
          fi
          current_code="$(node -e "const s=require('fs').readFileSync('android/app/build.gradle','utf8');const m=s.match(/^\\s*versionCode\\s+(\\d+)\\s*$/m);if(!m)process.exit(2);process.stdout.write(m[1])")"
          if [[ -z "$latest_tag" ]]; then
            version_code="$current_code"
          else
            version_code="$((current_code + 1))"
          fi
          node scripts/set-android-version.mjs "$version" "$version_code"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Synchronize web assets into Android
        run: npx cap sync android

      - name: Validate and materialize release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 in android-release.' >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD in android-release.' >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS in android-release.' >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD in android-release.' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/athir-release.jks"
          test -s "$RUNNER_TEMP/athir-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/athir-release.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          unset KEYSTORE_BASE64

      - name: Run hardware-free unit tests
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          ./android/gradlew --no-daemon --project-dir android :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/athir-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./android/gradlew --no-daemon --project-dir android :app:assembleRelease

      - name: Verify package metadata and APK signature
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          metadata="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -n 1)"
          printf '%s\n' "$metadata"
          grep -F "package: name='com.athir.datatransfer' versionCode='$VERSION_CODE' versionName='$VERSION'" <<< "$metadata"
          cp "$apk" "$RUNNER_TEMP/Athir-v$VERSION.apk"
          sha256="$(sha256sum "$RUNNER_TEMP/Athir-v$VERSION.apk" | cut -d ' ' -f 1)"
          size="$(stat -c '%s' "$RUNNER_TEMP/Athir-v$VERSION.apk")"
          echo "apk_path=$RUNNER_TEMP/Athir-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Build debug APK for manual testing
        env:
          ANDROID_KEYSTORE_PATH: ''
        run: |
          set -euo pipefail
          ./android/gradlew --no-daemon --project-dir android :app:assembleDebug
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Athir-debug.apk"
          sha256sum "$RUNNER_TEMP/Athir-debug.apk"

      - name: Upload debug APK artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: athir-debug-apk
          path: ${{ runner.temp }}/Athir-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Commit version bump and push release tag
        id: git-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json android/app/build.gradle
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(android): prepare release $RELEASE_TAG"
          fi
          gh auth setup-git
          git push origin HEAD:refs/heads/main
          git tag -a "$RELEASE_TAG" -m "Athir Android release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          echo 'tag_pushed=true' >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/athir-release-notes.md"
          cat > "$notes" <<EOF
          ## Android APK

          - Installable APK: \`Athir-v$VERSION.apk\`
          - Android package: \`com.athir.datatransfer\`
          - versionName: \`$VERSION\`; versionCode: \`$VERSION_CODE\`
          - Minimum Android version: Android 7.0 (API 24)
          - Built and signed in GitHub Actions; APK signature and package metadata verified.
          - Checks passed: TypeScript, Vite, Capacitor sync, signed Android release build, APK signature, and version metadata.
          - APK size: $APK_SIZE bytes
          - SHA-256: \`$APK_SHA256\`

          ### What this build actually does

          - Real byte-level peer-to-peer transfer over TLS 1.3/1.2 on the local network (no internet, no relay, no server).
          - Per-session ephemeral RSA-2048 keypair, self-signed X.509 certificate, SHA-256 certificate pinning and a 128-bit session secret delivered only through the QR code.
          - mDNS discovery publishes routing metadata only (device id, certificate fingerprint, protocol version). The pairing secret is never broadcast.
          - SHA-256 integrity verification of every received file; mismatching transfers are rejected and reported.
          - Native media catalogue (apps / photos / videos / audio / contacts / files) with real icons and thumbnails.
          - Foreground transfer service with wake and Wi-Fi locks, plus a persistent SQLite transfer history.

          ### Known limitations

          - A peer found over mDNS still requires a QR scan to pair (by design: the secret is never broadcast).
          - Wi-Fi Direct, local-only hotspot and Wi-Fi Aware transports are not implemented yet; transfers use the shared LAN/hotspot the devices are already connected to.
          - Transfers cannot resume after a disconnect yet.
          - No automated on-device test runs in this pipeline; see docs/NATIVE_REAL_TRANSFER_REPORT.md for the manual test checklist.
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Athir $RELEASE_TAG" --notes-file "$notes"
          gh release upload "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,url)"
          printf '%s\n' "$release_json" | jq -e --arg asset "Athir-v$VERSION.apk" \
            '.isDraft == true and any(.assets[]; .name == $asset and .size > 0)' >/dev/null
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          published="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,url)"
          printf '%s\n' "$published" | jq -e --arg asset "Athir-v$VERSION.apk" \
            '.isDraft == false and any(.assets[]; .name == $asset and .size > 0)' >/dev/null
          release_url="$(printf '%s\n' "$published" | jq -r '.url')"
          {
            echo "## Android release published"
            echo "- Release: [$RELEASE_TAG]($release_url)"
            echo "- APK: \`Athir-v$VERSION.apk\` ($APK_SIZE bytes)"
            echo "- SHA-256: \`$APK_SHA256\`"
            echo "- versionCode: $VERSION_CODE"
            echo "- Emulator testing: skipped as requested."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published $RELEASE_TAG: $release_url"

      - name: Roll back an unpublished draft and its tag after failure
        if: failure() && steps.git-release.outputs.tag_pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          if [[ "$draft" == 'true' ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          elif [[ "$draft" == 'missing' ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" >/dev/null || true
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/athir-release.jks"
